{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --bg-color: #0f1115;
        --card-bg: #1a1d24;
        --border-color: #2a2e39;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --color-red: #ef4444;
        --color-yellow: #eab308;
        --color-blue: #3b82f6;
        --color-green: #22c55e;
        --color-pink: #ec4899;
        --color-cyan: #06b6d4;
        --color-grey: #64748b;
        
        --hot-bg: rgba(239, 68, 68, 0.1);
        --warm-bg: rgba(234, 179, 8, 0.1);
    }
    
    body {
        background-color: var(--bg-color);
        color: var(--text-main);
    }
    
    .gap-dashboard {
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
    }
    
    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-color);
    }
    
    .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
    }
    
    .number-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .number-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    
    .number-card.hot {
        border-color: var(--color-red);
        background-color: var(--hot-bg);
        animation: pulse-red 2s infinite;
    }
    
    .number-card.warm {
        border-color: var(--color-yellow);
        background-color: var(--warm-bg);
    }
    
    .number-header {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 8px;
    }
    
    .color-Red { color: var(--color-red); }
    .color-Yellow { color: var(--color-yellow); }
    .color-Blue { color: var(--color-blue); }
    .color-Green { color: var(--color-green); }
    .color-Pink { color: var(--color-pink); }
    .color-Cyan { color: var(--color-cyan); }
    .color-Grey { color: var(--color-grey); }
    
    .gap-metric {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 8px 0;
        width: 100%;
    }
    
    .gap-metric-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    .gap-metric-value.current {
        font-size: 2.5rem;
        font-weight: 700;
        line-height: 1.2;
    }
    
    .stats-row {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border-color);
    }
    
    .stat-mini {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    
    .stat-mini .label {
        font-size: 0.65rem;
        color: var(--text-muted);
    }
    
    .stat-mini .val {
        font-size: 1rem;
        font-weight: 600;
    }
    
    @keyframes pulse-red {
        0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        color: var(--text-muted);
    }
    
    .pulse-dot {
        width: 8px;
        height: 8px;
        background-color: var(--color-green);
        border-radius: 50%;
        animation: pulse-green 2s infinite;
    }
    
    @keyframes pulse-green {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
        70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    
    .legend {
        display: flex;
        gap: 16px;
        margin-top: 24px;
        font-size: 0.875rem;
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .legend-box {
        width: 16px;
        height: 16px;
        border-radius: 4px;
    }
    .legend-hot { background-color: var(--hot-bg); border: 1px solid var(--color-red); }
    .legend-warm { background-color: var(--warm-bg); border: 1px solid var(--color-yellow); }
</style>

<div class="gap-dashboard">
    <div class="dashboard-header">
        <div>
            <h1 style="margin: 0; font-size: 1.5rem;">Live Gap Analysis</h1>
            <p style="margin: 4px 0 0 0; color: var(--text-muted);">Same completed history as the Global Timeline. Gaps count observed games; averages and maximums use completed gaps between appearances.</p>
        </div>
        <div class="status-indicator">
            <div class="pulse-dot"></div>
            <span id="last-updated">Updating live...</span>
        </div>
    </div>
    
    <div class="grid-container" id="gaps-container">
        <!-- Cards injected via JS -->
    </div>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-box legend-hot"></div>
            <span>Hot (Gap ≥ 85% of Max Gap)</span>
        </div>
        <div class="legend-item">
            <div class="legend-box legend-warm"></div>
            <span>Warm (Gap ≥ Avg Gap)</span>
        </div>
    </div>
</div>

<script>
    let updatingGaps = false;
    function updateDashboard() {
        if (updatingGaps) return;
        updatingGaps = true;
        fetch('/api/gaps/' + window.location.search, {cache: 'no-store', signal: AbortSignal.timeout(12000)})
            .then(response => {if (!response.ok) throw new Error('History unavailable'); return response.json();})
            .then(data => {
                const container = document.getElementById('gaps-container');
                container.innerHTML = '';
                
                data.stats.forEach(stat => {
                    const card = document.createElement('div');
                    card.className = 'number-card';
                    
                    // Determine state
                    if (stat.max_gap > 0 && stat.current_gap >= (stat.max_gap * 0.85)) {
                        card.classList.add('hot');
                    } else if (stat.average_gap > 0 && stat.current_gap >= stat.average_gap) {
                        card.classList.add('warm');
                    }
                    
                    card.innerHTML = `
                        <div class="number-header" style="color:${stat.display_color}">${stat.number}</div>
                        
                        <div class="gap-metric">
                            <span class="gap-metric-label">Current Gap</span>
                            <span class="gap-metric-value current">${stat.current_gap === null ? '—' : stat.current_gap + (stat.gap_lower_bound ? '+' : '')}</span>
                        </div>
                        
                        <div class="stats-row">
                            <div class="stat-mini">
                                <span class="label">Average</span>
                                <span class="val">${stat.average_gap ?? '—'}</span>
                            </div>
                            <div class="stat-mini">
                                <span class="label">Max Gap</span>
                                <span class="val">${stat.max_gap ?? '—'}</span>
                            </div>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
                
                const d = new Date();
                document.getElementById('last-updated').textContent = data.latest_game_id ? 'As of #' + data.latest_game_id + ' · ' + d.toLocaleTimeString() : 'Waiting for completed results';
            })
            .catch(error => {document.getElementById('last-updated').textContent = 'History unavailable · retrying';})
            .finally(() => {updatingGaps = false;});
    }
    
    // Initial load
    updateDashboard();
    
    // Poll every 3 seconds
    setInterval(() => {if (!document.hidden) updateDashboard();}, 3000);
    document.addEventListener('visibilitychange', () => {if (!document.hidden) updateDashboard();});
</script>
{% endblock %}
