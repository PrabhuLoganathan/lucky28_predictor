{% if page_obj.paginator.num_pages > 1 %}<nav aria-label="Pagination" class="d-flex justify-content-between align-items-center mt-3"><span class="text-secondary">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="btn btn-outline-secondary me-2" href="?{{ filter_query }}&page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="?{{ filter_query }}&page={{ page_obj.next_page_number }}">Next</a>{% endif %}</div></nav>{% endif %}
