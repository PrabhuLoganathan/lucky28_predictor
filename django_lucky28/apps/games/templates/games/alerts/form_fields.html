{{ form.non_field_errors }}
{% for field in form %}<div class="mb-4" data-field="{{ field.name }}">{% if field.field.widget.input_type == 'checkbox' %}<div class="form-check">{{ field }}<label for="{{ field.id_for_label }}" class="form-check-label">{{ field.label }}</label></div>{% else %}<label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>{{ field }}{% endif %}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{{ field.errors }}</div>{% endfor %}
