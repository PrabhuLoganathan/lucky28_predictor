{% extends "admin/base_site.html" %}
{% block content %}
<h1>{{ title }}</h1>
<p>Upload a CSV with a single <code>result</code> column (0–27).</p>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="submit" value="Import" class="default">
</form>
{% endblock %}
